되었습니다. 스타디움 스타디움 점수판이 정상적으로 표시되지 않는 현상 확인된 현상 팀 드라이브 지난 팀 드라이브 기간 중 일부 경쟁전에서 플레이어 간 실력 격차가 지나치게 큰 매치가 생성되는 현상의도하...","https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26111009594670b178.png","2026.11.04",{"count1":21,"count2":21,"count3":21,"count4":21,"count5":21},{"newsNo":33,"categoryId":15,"title":34,"slug":35,"content":8,"summary":36,"thumbnailUrl":37,"isComment":20,"readCount":21,"commentCount":21,"createdAt":30,"isNew":20,"isPublic":20,"isPrize":20,"reaction":38,"event":8},858,"오버워치 패치 노트 - 2026년 11월 4일","patch-2026-11-03","군림 군림 이벤트가 11월 4일부터 12월 8일까지 진행됩니다. 게임을 플레이하고 도전 과제를 완료해 이벤트 전용 보상을 획득하거나, 패스를 업그레이드하여 전설 둠피스트 스킨과 벤데타 전설 무기 등 프리미엄 보상을 획득하세요. OWCS 월드 파이널 응원 대회 도전 과제를 완료하고 응원을 모으세요! 11월 25일부터 12월 8일까지 경기를 플레이하고 도전 과제를 완료하면 응원을 획득합니다. 추가 응원은 12월 3일부터 12월 7일까지 공식 채널에서 OWCS 월드 파이널 방송을 시청해 획득할 수 있습니다. 대회를 응원할 수 있는 OWCS 월드 파이널 응원 대회 이벤트 페이지를 확인해 보세요. 응원에 대한 감사의 의미로, 전리품 상자, 배틀 패스 경험치, 멋진 꾸미기 아이템까지 보상으로 드립니다! 정크랫의 전리품 사냥 및 주말 동안 경험치 2배 11월 20일부터 11월 24일까지 전리품으로 가득한 주말을 위해 정크랫의 전리품 사냥이 돌아옵니다. 이번에는 경험치 두 배 보너스도 같이요...","https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425080a7e17_thumb.png",{"count1":21,"count2":21,"count3":21,"count4":21,"count5":21},{"newsNo":40,"categoryId":15,"title":41,"slug":42,"content":8,"summary":43,"thumbnailUrl":44,"isComment":20,"readCount":21,"commentCount":21,"createdAt":45,"isNew":20,"isPublic":20,"isPrize":20,"reaction":46,"event":8},851,"오버워치 패치 노트 - 2026년 10월 21일","patch-2026-10-20","버그 수정 업데이트 버그 수정 업데이트입니다. 리플레이 코드는 모두 제거되었습니다. 버그 수정 일반 솜브라에게 감사 표시를 할 경우 고마운 \"고마움을 담아서\" 도전 과제가 완료되지 않던 문제를 수정했습니다. DuanSense 컨트롤러가 PC에서 제대로 작동하지 않던 문제를 수정했습니다.","https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2610210310010a2741_thumb.png","2026.10.21",{"count1":21,"count2":21,"count3":21,"count4":21,"count5":21},{"newsNo":48,"categoryId":15,"title":49,"slug":50,"content":8,"summary":51,"thumbnailUrl":52,"isComment":20,"readCount":21,"comme
