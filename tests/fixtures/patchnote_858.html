<script type="application/json" data-nuxt-data="nuxt-app" data-ssr="true" id="__NUXT_DATA__">[["ShallowReactive",1],{"data":2,"state":33,"once":45,"_errors":46,"serverRendered":24,"path":48,"pinia":49},["ShallowReactive",3],{"news-detail-858":4,"news-season-link":21},{"status":5,"message":6,"data":7},"success",null,{"detail":8},{"newsNo":9,"categoryId":10,"title":11,"slug":12,"content":13,"summary":14,"thumbnailUrl":15,"isComment":16,"readCount":17,"commentCount":18,"createdAt":19,"isNew":16,"isPublic":16,"isPrize":16,"reaction":20,"event":6},858,2,"오버워치 패치 노트 - 2026년 11월 4일","patch-2026-11-03","\u003Cdiv class=\"anchor\" id=\"patch-2026-11-03\">&nbsp;\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">군림\u003C\u002Fh4>\u003Cdiv class=\"PatchNotes-sectionDescription\">\u003Cp>군림 이벤트가 11월 4일부터 12월 8일까지 진행됩니다. 게임을 플레이하고 도전 과제를 완료해 이벤트 전용 보상을 획득하거나, 패스를 업그레이드하여 전설 둠피스트 스킨과 벤데타 전설 무기 등 프리미엄 보상을 획득하세요.\u003C\u002Fp>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">OWCS 월드 파이널 응원 대회\u003C\u002Fh4>\u003Cdiv class=\"PatchNotes-sectionDescription\">\u003Cp>도전 과제를 완료하고 응원을 모으세요!\u003C\u002Fp>\u003Cul>\u003Cli>11월 25일부터 12월 8일까지 경기를 플레이하고 도전 과제를 완료하면 응원을 획득합니다.\u003C\u002Fli>\u003Cli>추가 응원은 12월 3일부터 12월 7일까지 공식 채널에서 OWCS 월드 파이널 방송을 시청해 획득할 수 있습니다.\u003C\u002Fli>\u003Cli>대회를 응원할 수 있는 OWCS 월드 파이널 응원 대회 이벤트 페이지를 확인해 보세요. 응원에 대한 감사의 의미로, 전리품 상자, 배틀 패스 경험치, 멋진 꾸미기 아이템까지 보상으로 드립니다!\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">정크랫의 전리품 사냥 및 주말 동안 경험치 2배\u003C\u002Fh4>\u003Cdiv class=\"PatchNotes-sectionDescription\">\u003Cp>11월 20일부터 11월 24일까지 전리품으로 가득한 주말을 위해 정크랫의 전리품 사냥이 돌아옵니다. 이번에는 경험치 두 배 보너스도 같이요! 매 경기를 플레이할 때마다 전리품 상자에 가까워지며, 도전 과제가 유연하게 조정되므로 한 번에 모든 보상을 노리거나 자신만의 속도로 진행할 수도 있습니다. 진행도는 초기화되지 않으며, 매일 접속할 필요나 말도 안 되는 과제도 없죠... 그저 폭발과 산더미 같은 전리품만 가득합니다!\u003C\u002Fp>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">발굴 입문\u003C\u002Fh4>\u003Cdiv class=\"PatchNotes-sectionDescription\">\u003Cp>11월 4일부터 12월 8일까지, 발굴 입문이 몇 가지 변화와 함께 돌아옵니다! 로그인해 게임에서 승리하면 전리품 상자를 획득할 수 있습니다. 여러 주에 걸쳐 도전 과제들을 완료하고 기본, 특급, 전설 전리품 상자를 획득하세요.\u003C\u002Fp>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">일반 업데이트\u003C\u002Fh4>\u003Cdiv class=\"PatchNotesGeneralUpdate\">\u003Cdiv class=\"PatchNotesGeneralUpdate-title\">고의적 아군 방해 탐지\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate-description\">\u003Cp>저희는 오버워치에서 고의적 아군 방해를 방지하는 도구를 개선하고 있습니다. 현재 탐지 도구가 개선되어 악질 행위를 하는 플레이어를 보다 정확히 탐지할 수 있게 되었습니다. 이미 이러한 시스템으로 탐지된 여러 플레이어에게 조치를 취한 상태입니다. 고의적 아군 방해 행위의 예시로는 의도적으로 계속하여 팀 전투에 기여하지 않거나, 반복적으로 전장 밖으로 뛰어내리거나, 일부러 팀의 진행을 가로막는 것이 포함됩니다. 앞으로도 이러한 탐지 방법을 계속해서 개선하여 의도적으로 다른 플레이어의 경험을 망치는 플레이어를 더 많이 잡아내도록 하겠습니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">영웅 업데이트\u003C\u002Fh4>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-hero_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">돌격 영웅\u003C\u002Fh4>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"D.Mon\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425047f3262.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">D.Mon\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 파워 배리어 변경 사항은 배리어를 더 신중하게 전개하도록 하고, 적이 보다 쉽게 인식할 수 있도록 하기 위한 것입니다. 추진기의 밀쳐내기 효과는 그대로 유지되겠지만 더 이상 명중 피해는 주지 않아 D.Mon의 순간 피해 잠재력이 감소합니다. 추가 강타의 총 생명력 회복량을 제한하도록 생명력 흡수량도 감소했습니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>추가 강타 - 주요 특전\u003C\u002Fp>\u003Cul>\u003Cli>생명력 흡수량이 150%에서 125%로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425049296ec.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">파워 배리어\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>회복 시간이 0.2초에서 0.3초로 증가했습니다.\u003C\u002Fli>\u003Cli>이제 전개한 방벽이 최소 0.25초 동안 유지됩니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425040d460d.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">추진기\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>명중 피해가 15에서 0으로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"정커퀸\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042504666f55.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">정커퀸\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 정커퀸은 생명력이 낮아, 부상을 입히지 못해 치유 효과를 받을 수 없는 상황에서는 교전 능력이 크게 제한되었습니다. 기본 생명력이 증가하면 생존성이 향상될 것이며, 도륙의 재사용 대기시간이 감소하면 범위 내 적에게 사용할 기회가 늘어날 것입니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cul>\u003Cli>기본 생명력이 375에서 425로 증가했습니다.\u003C\u002Fli>\u003Cli>기본 생명력이 450에서 500으로 증가했습니다. (6대6)\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425043ac2d3.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">지휘의 외침\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>범위 내 아군과 현재 지휘의 외침 효과를 받고 있는 아군을 추적하는 신규 UI 요소를 추가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425049b9675.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">도륙\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>재사용 대기시간이 9초에서 7초로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"마우가\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042504571106.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">마우가\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 마우가는 최근 변경으로 인해 전반적인 효율이 감소했으며, 승률도 적정 수준 아래로 떨어졌습니다. 기본 방어력을 일부 되돌려 생존성을 개선하는 동시에 불태우기 피해도 증가시켜, 적 돌격 영웅에게는 과한 부담을 안기지 않으면서 적에게 불을 붙이는 플레이를 장려하고자 합니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cul>\u003Cli>기본 방어력이 125에서 150으로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042505bef838.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">화염 기관포\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>지속 불태우기 피해량이 15에서 20으로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"라마트라\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042505f684e6.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">라마트라\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 공허 가속기 탄약 수를 증가시키면 네메시스 형태가 아닐 때라도 라마트라가 원거리에서 지속적인 압박을 가하는 능력이 향상될 것입니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042505da0902.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">공허 가속기\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>탄약이 100발에서 125발로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"윈스턴\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042505907e21.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">윈스턴\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 방벽 생성기의 재사용 대기시간이 감소한 이후, 활력 충전 방벽의 활성 시간이 증가해 효율이 더 상승했습니다. 균형을 맞추고자 치유량을 약간 낮추려 합니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>활력 충전 방벽 - 주요 특전\u003C\u002Fp>\u003Cul>\u003Cli>초당 치유량이 35에서 30으로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-hero_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">공격 영웅\u003C\u002Fh4>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"안란\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26110404250568b76e.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">안란\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 맹염 질주의 밀쳐내기 효과와 같은 대상을 여러 번 적중할 수 있는 능력을 제거하면 한 번의 사용 중 효율이 제한됩니다. 주작의 부채 공격력을 증가시키면 안란의 원거리 효율성이 향상되고, 기본 발사로 불을 붙일 기회가 늘어날 것입니다. 불사조 승천의 시전 시간 또한 줄여 난전 중 상황에 더 빠르게 대응할 수 있게 하려 합니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425053d8e42.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">주작의 부채\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>공격력이 22에서 24로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425051e77b6.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">맹염 질주\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>밀쳐내기 효과가 제거되었습니다.\u003C\u002Fli>\u003Cli>더 이상 한 번의 사용으로 같은 대상을 여러 번 적중할 수 없습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425052bcf5b.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">불사조 승천\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>시전 시간이 1.2초에서 1초로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"에코\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425053a0864.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">에코\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 이제 공중 탄약 사용 시 탄약이 보충되어 특전 가치가 증가하고, 사용 직후 재장전하지 않아도 됩니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>공중 탄약 - 보조 특전\u003C\u002Fp>\u003Cul>\u003Cli>사용 시 탄약을 추가로 보충합니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"엠레\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042505cba6d8.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">엠레\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 사이버 파편 수류탄의 폭발 시간을 줄이면 반응성이 향상되고 대상을 더 확실하게 마무리할 수 있게 됩니다.\u003C\u002Fp>\u003Cp>또한 엠레의 기본(사용자 지정) 조준선 설정에 몇 가지 소규모 편의성 변경 사항도 추가했습니다. 이러한 설정이 엠레의 기본 조준선에 실제 적용될 때 발생하던 사소한 시각적 불일치 문제 몇 개도 수정했습니다. 엠레의 게임 내 조준선은 변경되지 않습니다. 이러한 변경 사항 모두는 기본 조준선의 사용자 지정 설정과 관련된 것입니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cul>\u003Cli>기본 조준선에 회전 조준선 설정을 추가했습니다.\u003C\u002Fli>\u003Cli>기본 조준선에서 두께 조준선 설정을 제거했습니다.\u003C\u002Fli>\u003Cli>기본 조준선이 윤곽선 두께와 윤곽선 변화 값을 사용하지 않던 시각적 불일치 문제를 수정했습니다.\u003C\u002Fli>\u003Cli>설정에서 기본 조준선 미리보기를 업데이트해 실제 게임 내 조준선을 더 유사하게 반영하도록 했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042505b08495.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">사이버 파편 수류탄\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>폭발 시간이 0.6초에서 0.5초로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"겐지\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425055fe922.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">겐지\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 겐지의 최근 변경 사항은 상대를 확실히 처치하는 능력을 향상하고 보다 공격적인 플레이스타일을 가능케 했습니다. 튕겨내기의 지속 시간이 감소하면 사용 시점의 중요성을 높이고, 활성 시간을 방어적 용도로 사용하는 빈도가 제한될 것입니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425053dcee8.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">튕겨내기\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>지속 시간이 2초에서 1.5초로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"한조\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425053a016e.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">한조\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 음파 분열이 더 이상 솜브라의 해킹된 생명력 팩을 덮어쓰지 않아, 두 영웅 중 누구도 이미 상대가 장악한 생명력 팩을 덮어쓸 수 없게 됩니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>음파 분열 - 보조 특전\u003C\u002Fp>\u003Cul>\u003Cli>더 이상 솜브라의 해킹된 생명력 팩을 덮어쓰지 않습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"리퍼\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425059e6345.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">리퍼\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 최근 히트박스 및 투사체 크기 변경으로 인해 리퍼의 전체적인 효율이 떨어졌습니다. 기본 생명력을 증가시키면 생존성이 향상되어 이러한 변경 사항을 보완할 것입니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cul>\u003Cli>기본 생명력이 275에서 300으로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"시온\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26110404250587b0c6.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">시온\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 처형의 시작 산탄 범위를 줄이면, 근거리에서 완전히 충전하지 않아도 더 안정적으로 적을 맞힐 수 있을 것입니다. 광란의 살육에서 이동과 발사 사이의 시간도 줄어들어, 시온이 보다 빠르게 위치를 변경할 수 있고 연사 간 지연이 감소합니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26110404250528156f.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">처형\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>시작 산탄 범위가 8.5도에서 5.7도로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425069fddda.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">광란의 살육\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>연사당 시전 시간\u002F이동 시간이 0.6초에서 0.5초로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"벤데타\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26110404250664f83d.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">벤데타\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 최근 변경으로 인해 벤데타의 전반적인 살상력이 향상됐습니다. 팔라틴 팽의 최초 휘두르기 지연을 증가시키면 연속 공격 속도가 줄어들고, 내리치기 도약 속도를 감소시키면 벤데타의 움직임을 더 쉽게 추적할 수 있을 것입니다. 맹렬한 폭풍 장착 시의 소용돌이 질주 밀쳐내기 효과도 감소시켜, 여러 번 적중당한 적이 반복적으로 밀려나는 현상을 제한하려 합니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425069f2911.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">팔라틴 팽\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>내리치기 도약 속도가 11에서 9.5로 감소했습니다.\u003C\u002Fli>\u003Cli>첫 휘두르기 지연 시간이 0.15초에서 0.2초로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26110404250691cf87.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">소용돌이 질주\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>맹렬한 폭풍 특전의 수평 밀쳐내기 강도가 8에서 4로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-hero_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">지원 영웅\u003C\u002Fh4>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"아나\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506e43da7.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">아나\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 최근 변경으로 생체 수류탄의 자가 치유량이 증가하자 적에 대한 순간 피해도 증가했습니다. 피해와 치유량 값을 분리해 공격력을 줄이는 한편 증가한 자가 치유량은 그대로 유지하고자 합니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425069f99ff.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">생체 수류탄\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>폭발 피해가 90에서 60으로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"바티스트\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506297c19.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">바티스트\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506c3a3e3.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">치유 파동\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>범위 내 아군과 현재 치유 파동 효과를 받고 있는 아군을 추적하는 신규 UI 요소를 추가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"브리기테\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506f8a732.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">브리기테\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 격려에 즉시 치유를 추가함으로써 브리기테의 치유 능력이 향상되었지만, 전투 중 자신과 아군을 생존시키는 능력에는 제한적인 영향만 주었습니다. 즉시 치유량을 증가시키고 내부적인 재사용 대기시간을 감소시키면 계속되는 교전에서 더 자주 치유할 수 있게 될 것입니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506a6400c.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">격려\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>내부 재사용 대기시간이 1.25초에서 1초로 감소했습니다.\u003C\u002Fli>\u003Cli>즉시 치유량이 12에서 15로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"독트린\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425067db2f9.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">독트린\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 개발자 의견: 독트린은 다양한 보조 효과를 제공하는 것에 비해 치유량이 높은 수준을 유지해 왔습니다. 영겁의 홀 기본 발사 후 회복 시간을 늘려 전반적인 치유량을 낮추고, 주입 상태의 피해량과 치유량을 감소시켜 순간적인 영향력을 줄였습니다. 추진형 장막과 주입의 재사용 대기시간도 늘려 교전 중 두 기술을 더욱 신중하게 사용하도록 했습니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506dcb68b.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">추진형 장막\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>재사용 대기시간이 8초에서 10초로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506c678f7.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">주입\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>재사용 대기시간이 8초에서 9초로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261014061500ac0bce.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cp>\u003Cstrong>영겁의 홀\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>\u003Cp paraeid=\"{f014dbce-282a-4306-aa1a-b918c43a3280}{252}\" paraid=\"1830533474\">기본 발사 후딜레이가 0.6초에서 0.65초로 증가했습니다.&nbsp;\u003C\u002Fp>\u003C\u002Fli>\u003Cli>\u003Cp paraeid=\"{f014dbce-282a-4306-aa1a-b918c43a3280}{252}\" paraid=\"1830533474\">주입 상태의 피해량이 90에서 80으로 감소했습니다.&nbsp;\u003C\u002Fp>\u003C\u002Fli>\u003Cli>\u003Cp paraeid=\"{f014dbce-282a-4306-aa1a-b918c43a3280}{252}\" paraid=\"1830533474\">주입 상태의 치유량이 120에서 110으로 감소했습니다.&nbsp;\u003C\u002Fp>\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"일리아리\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506e19056.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">일리아리\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 최근 투사체 크기 변경으로 인해 일리아리의 전반적인 공격 효율이 떨어졌습니다. 태양 소총의 기본 발사 충전 시간을 줄이면 한 발 한 발에 대한 의존도는 낮아지고, 전체적인 피해량은 증가해 공격력이 높은 지원 영웅으로서의 강점이 부각될 것입니다. 치유의 태양석 치유량 또한 증가해, 태양석을 효과적으로 배치했을 때 일리아리의 방어 태세가 더욱 공고해집니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506a3b03c.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">태양 소총\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>최대 충전 시간이 0.65초에서 0.575초로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042506e945a4.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">치유의 태양석\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>투사체당 치유량이 40에서 50으로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"제트팩 캣\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425063da7e4.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">제트팩 캣\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 제트팩 캣의 생존성과 공중 기동성은 계속해서 강력한 수준이었습니다. 기본 생명력을 낮추어 생존성과 이러한 기동성으로 인한 공격성을 제한합니다. 기동성 자체는 핵심적인 강점으로 그대로 유지됩니다. 정신 없는 비행의 가속도도 증가해 보다 빠른 위치 변경이 가능해지며, 연료 재생량은 줄어들어 사용 빈도가 제한됩니다.\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cul>\u003Cli>기본 생명력이 225에서 200으로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042507124c3a.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">정신 없는 비행\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>가속도가 초당 25미터에서 28미터로 증가했습니다.\u003C\u002Fli>\u003Cli>연료 재생률이 초당 25%에서 20%로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"솜브라\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425077b290b.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">솜브라\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotes-dev PatchNotesHeroUpdate-dev\">\u003Cp>개발자의 의견: 긴급 패치의 지속 시간이 길어 사용 시점과 대상을 신중하게 선택할 필요성이 상대적으로 낮았습니다. 지속 시간을 줄여 적절한 사용 시점과 대상 선택의 중요성을 높이면서도 효과적으로 사용했을 때의 효용성은 유지했습니다. 사이버 스페이스의 약화 효과도 감소시켜 영향을 받은 적이 대응할 기회를 늘렸습니다. 또한 솜브라의 해킹과 한조의 음파 교란 사이의 생명력 팩 상호작용 변경 사항에 맞춰, EMP가 생명력 팩에 적용된 모든 적의 효과를 덮어쓰도록 변경했습니다.&nbsp;\u003C\u002Fp>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-abilitiesList\">\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261007032017dadbee.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">긴급 패치\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>지속 시간이 12초에서 10초로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042507e4233d.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">사이버 스페이스\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>약화 효과가 50%에서 40%로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate\">\u003Cdiv class=\"PatchNotesAbilityUpdate-icon-container\">\u003Cimg alt=\"\" class=\"PatchNotesAbilityUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042507e544e2.png\">\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-text\">\u003Cdiv class=\"PatchNotesAbilityUpdate-name\">EMP\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesAbilityUpdate-detailList\">\u003Cul>\u003Cli>이제 생명력 팩에 적용된 적의 해킹 효과를 덮어씁니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">스타디움 업데이트\u003C\u002Fh4>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-hero_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">돌격 영웅\u003C\u002Fh4>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"윈스턴\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042505907e21.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">윈스턴\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>\u003Cstrong>테슬라장 - 파워\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>테슬라장 피해가 매초 40에서 30으로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-hero_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">공격 영웅\u003C\u002Fh4>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"캐서디\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042507657f22.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">캐서디\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>\u003Cstrong>터지는 포화 - 파워\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>피해 감소량이 60%에서 50%로 완화되었습니다.\u003C\u002Fli>\u003C\u002Ful>\u003Cp>\u003Cstrong>은탄환 - 파워\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>피해가 50에서 60으로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"겐지\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425055fe922.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">겐지\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>\u003Cstrong>용의 아가리 - 파워\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>중첩당 질풍참 피해가 10%에서 15%로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"소전\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F261104042507d5c51c.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">소전\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>\u003Cstrong>강력 부착 - 파워\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>피해 감소량이 25%에서 10%로 완화되었습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate\">\u003Cdiv class=\"PatchNotesHeroUpdate-header\">\u003Cimg alt=\"벤데타\" class=\"PatchNotesHeroUpdate-icon\" src=\"https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26110404250664f83d.png\">\u003Ch5 class=\"PatchNotesHeroUpdate-name\">벤데타\u003C\u002Fh5>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesHeroUpdate-body\">\u003Cdiv class=\"PatchNotesHeroUpdate-generalUpdates\">\u003Cp>\u003Cstrong>정점의 핏빛 욕망 - 파워\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>생명력 흡수가 4%에서 3%로 감소했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003Cp>\u003Cstrong>마구잡이 맹공격 - 파워\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>맹공의 중첩 증가에 필요한 처치 횟수가 2회에서 3회로 증가했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotes-section PatchNotes-section-generic_update\">\u003Ch4 class=\"PatchNotes-sectionTitle\">버그 수정\u003C\u002Fh4>\u003Cdiv class=\"PatchNotesGeneralUpdate\">\u003Cdiv class=\"PatchNotesGeneralUpdate-title\">일반\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate-description\">\u003Cul>\u003Cli>시에라의 Made My Night 스킨 사용 중에 발생하던 무기 오디오 문제를 수정했습니다.\u003C\u002Fli>\u003Cli>주노의 Pureflow 및 Fearless 스킨 관련 문제를 수정했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate\">\u003Cdiv class=\"PatchNotesGeneralUpdate-title\">영웅\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate-description\">\u003Cp>\u003Cstrong>D.Mon\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>공중에서 추진기를 사용하면 지상에서 사용할 때에 비해 D.Mon이 훨씬 빨리 날아가던 문제를 수정했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003Cp>\u003Cstrong>미즈키\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>미즈키가 서킷 로얄에서 화물에 끼일 수 있던 문제를 수정했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003Cp>\u003Cstrong>솜브라\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>아군 생명력 막대를 &quot;상황별&quot;로 설정한 경우 발생하던 문제를 수정했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003Cp>\u003Cstrong>레킹볼\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>레킹볼의 갈고리 고정으로 줄을 당기는 조작을 하면 구르기 이동 속도가 크게 증가하던 문제를 수정했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate\">\u003Cdiv class=\"PatchNotesGeneralUpdate-title\">전장\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate-description\">\u003Cp>\u003Cstrong>아이헨발데 - 혼합\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>성가신 아이헨발데 시야 문제가 다시는 발생하지 않도록 처리했습니다. 미안해요, 토르비욘!\u003C\u002Fli>\u003C\u002Ful>\u003Cp>\u003Cstrong>감시 기지: 지브롤터 - 호위\u003C\u002Fstrong>\u003C\u002Fp>\u003Cul>\u003Cli>감시 기지: 지브롤터에서 일부 영웅이 끼일 수 있던 지점을 수정했습니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate\">\u003Cdiv class=\"PatchNotesGeneralUpdate-title\">스타디움\u003C\u002Fdiv>\u003Cdiv class=\"PatchNotesGeneralUpdate-description\">\u003Cul>\u003Cli>이전 업데이트에서, 의도치 않게 작동하여 스타디움 경쟁전에서 제거했던 그룹 편성 제한이 다시 적용되었습니다.\u003C\u002Fli>\u003Cli>벤데타의 팽창 강철이 의도한 것보다 팔라틴 팽 휘두르기 범위를 더 많이 증가시키던 문제를 수정했습니다.\u003C\u002Fli>\u003Cli>엘사카 제압기가 이제 D.Va에게 올바르게 적용됩니다.\u003C\u002Fli>\u003C\u002Ful>\u003C\u002Fdiv>\u003C\u002Fdiv>\u003C\u002Fdiv>","","https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F2611040425080a7e17_thumb.png",false,14234,0,"2026.11.04",{"count1":18,"count2":18,"count3":18,"count4":18,"count5":18},{"status":5,"message":6,"data":22},{"lastSeqNo":23,"hasNextPage":24,"list":25},857,true,[26],{"newsNo":23,"categoryId":27,"title":28,"slug":29,"content":6,"summary":30,"thumbnailUrl":31,"isComment":16,"readCount":18,"commentCount":18,"createdAt":19,"isNew":16,"isPublic":16,"isPrize":16,"reaction":32,"event":6},1,"탈론의 지배 - 5시즌 중간 패치로 결전의 막이 오릅니다","탈론의-지배-5시즌-중간-패치로-결전의-막이-오릅니다","5시즌의 시작과 함께 무언가 사악한 것이 풀려났습니다. 이제 이 모든 소동이 어디로 이어지는지 직접 알아볼 시간입니다. 시즌 중반 업데이트에서는 둠피스트와 오버워치가 벤데타를 완전히 저지하려 마지막 전장인 리알토에 모입니다. 이로써 일 년 동안 이어진 탈론의 지배 스토리가 대장정의 막을 내립니다. 하지만 막바지에 이르렀다고 해서 속도를 늦출 수는 없죠. 생존을 위해 분투하는 또 다른 미래에서 이브 프로토콜이 찾아오고, 로드호그는 한층 더 죽음에 물든 모습으로 변하며(왠지 식욕이 더 왕성해졌고요!), 정크랫은 또 전리품 상자를 파헤치고 다니고 있습니다. 어둠의 신조가 끝나기 전 그림자 속에서 아직도 수많은 콘텐츠가 기다립니다. 운명의 재회 결국 여기까지 왔습니다. 지난 한 해 동안, 탈론 내부의 권력 균형은 요동쳤고 산산조각 났습니다. 벤데타는 왕좌를 차지했고, 둠피스트는 그대로 몰락하기를 거부했으며, 독트린이 그림스뵈튼에서 모습을 드러냈죠. 이제 운명의 실이 군림 이벤트에서 마...","https:\u002F\u002Fsht-vod.dn.nexoncdn.co.kr\u002Fshpd-comm\u002FNews\u002FOW\u002F26110404040556af3f.png",{"count1":18,"count2":18,"count3":18,"count4":18,"count5":18},["Reactive",34],{"$snode-now-ms":35,"$ssite-config":36,"$svue-query":42},1794643891027,{"_priority":
