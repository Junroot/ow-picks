name: 통계 갱신 및 배포

on:
  schedule:
    # 매일 20:00 UTC = 05:00 KST. 공식 통계는 패치 후 최대 하루 뒤에 반영된다.
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치지 않게. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 속도 제한에 걸리면 수집기가 길게 기다린다. 그래도 이 시간을 넘기면 기다려서
    # 풀릴 상황이 아니니, 러너를 몇 시간씩 붙들지 말고 끊는다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 요청 837건 (티어 9 × 지역 3 × (맵 30 + 기준선)). 잘 풀리면 6~13분.
      # 러너에서 403 을 맞은 적이 있어 동시 요청과 간격을 넉넉하게 잡았다. 하루 1회
      # 도는 작업이라 몇 분 더 걸리는 편이 차단당하는 것보다 낫다. 사이트가 지치면
      # 수집기가 전체 워커를 최대 2분씩 세우므로 그만큼 더 걸릴 수 있다.
      - name: 영웅 통계 수집
        run: python scripts/fetch_rates.py --workers 2 --delay 0.6

      - name: 수집 결과 확인
        run: |
          python - <<'PY'
          import json, pathlib, sys
          data = pathlib.Path('site/data')
          shards = sorted(p for p in data.glob('*.json') if p.name != 'meta.json')
          meta = json.loads((data / 'meta.json').read_text(encoding='utf-8'))
          expected = len(meta['tiers']) * len(meta['regions'])
          heroes, maps = len(meta['heroes']), len(meta['maps'])
          print(f'샤드 {len(shards)}/{expected}, 영웅 {heroes}, 맵 {maps}')
          problems = []
          if len(shards) != expected:
              problems.append(f'샤드 수가 맞지 않습니다 ({len(shards)} != {expected})')
          # 하한선은 파싱이 깨졌을 때를 잡기 위한 것이다. 영웅이나 맵이 늘어나는 것은 통과한다.
          if heroes < 30:
              problems.append(f'영웅이 {heroes}명뿐입니다. 페이지 구조가 바뀐 것 같습니다')
          if maps < 20:
              problems.append(f'맵이 {maps}개뿐입니다. 페이지 구조가 바뀐 것 같습니다')
          # 사이트가 특정 (맵, 티어, 지역) 조합을 못 내려주는 일이 있어 빈 칸은 허용한다.
          # 다만 한 샤드가 크게 비면 그 티어·지역은 통계로 쓸 수 없으니 배포하지 않는다.
          empty = 0
          for path in shards:
              shard = json.loads(path.read_text(encoding='utf-8'))
              empty += len(shard.get('missing', []))
              if len(shard['maps']) < (maps + 1) * 0.9:
                  problems.append(f'{path.name}: 맵 {len(shard["maps"])}개 (기대 {maps + 1})')
          print(f'사이트가 못 준 칸 {empty}개')
          if problems:
              sys.exit('배포하지 않습니다 — ' + '; '.join(problems[:5]))
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
