name: 통계 갱신 및 배포

on:
  schedule:
    # 매일 20:00 UTC = 05:00 KST. 공식 통계는 패치 후 최대 하루 뒤에 반영된다.
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  # data 브랜치(패치 구간 기록)에 푸시한다. 실행 조건이 schedule·수동·main push 뿐이라
  # 포크 PR 에는 쓰기 권한과 secret 이 넘어가지 않는다.
  contents: write
  pages: write
  id-token: write

env:
  # 메타 해설을 쓰는 모델. 하루 한두 번만 부르므로 사용량보다 해설 품질을 우선한다.
  CLAUDE_MODEL: claude-opus-5-5

# 배포는 겹치지 않게. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 속도 제한에 걸리면 수집기가 길게 기다린다. 그래도 이 시간을 넘기면 기다려서
    # 풀릴 상황이 아니니, 러너를 몇 시간씩 붙들지 말고 끊는다.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 요청 279건 (등급 9 × 지역 1(한국) × (맵 30 + 기준선)). 잘 풀리면 3~5분.
      # 러너에서 403 을 맞은 적이 있어 동시 요청과 간격을 넉넉하게 잡았다. 하루 1회
      # 도는 작업이라 몇 분 더 걸리는 편이 차단당하는 것보다 낫다. 사이트가 지치면
      # 수집기가 전체 워커를 최대 2분씩 세우므로 그만큼 더 걸릴 수 있다.
      - name: 영웅 통계 수집
        run: python scripts/fetch_rates.py --workers 2 --delay 0.6

      - name: 수집 결과 확인
        run: |
          python - <<'PY'
          import json, pathlib, sys
          data = pathlib.Path('site/data')
          shards = sorted(p for p in data.glob('*.json') if p.name != 'meta.json')
          meta = json.loads((data / 'meta.json').read_text(encoding='utf-8'))
          expected = len(meta['tiers']) * len(meta['regions'])
          heroes, maps = len(meta['heroes']), len(meta['maps'])
          print(f'샤드 {len(shards)}/{expected}, 영웅 {heroes}, 맵 {maps}')
          problems = []
          if len(shards) != expected:
              problems.append(f'샤드 수가 맞지 않습니다 ({len(shards)} != {expected})')
          # 하한선은 파싱이 깨졌을 때를 잡기 위한 것이다. 영웅이나 맵이 늘어나는 것은 통과한다.
          if heroes < 30:
              problems.append(f'영웅이 {heroes}명뿐입니다. 페이지 구조가 바뀐 것 같습니다')
          if maps < 20:
              problems.append(f'맵이 {maps}개뿐입니다. 페이지 구조가 바뀐 것 같습니다')
          # 사이트가 특정 (맵, 티어, 지역) 조합을 못 내려주는 일이 있어 빈 칸은 허용한다.
          # 다만 한 샤드가 크게 비면 그 티어·지역은 통계로 쓸 수 없으니 배포하지 않는다.
          empty = 0
          banned = 0
          for path in shards:
              shard = json.loads(path.read_text(encoding='utf-8'))
              empty += len(shard.get('missing', []))
              if len(shard['maps']) < (maps + 1) * 0.9:
                  problems.append(f'{path.name}: 맵 {len(shard["maps"])}개 (기대 {maps + 1})')
              banned += sum(
                  1
                  for rows in shard['maps'].values()
                  for pick, ban, win in rows.values()
                  if ban
              )
          print(f'사이트가 못 준 칸 {empty}개, 밴률이 0이 아닌 칸 {banned}개')
          # 밴이 하나도 없다면 경쟁전이 아니라 빠른 대전을 받아온 것이다. 그 데이터로는
          # 유효 픽률이 원본 픽률과 같아져서, 이 사이트가 존재할 이유가 없어진다.
          if not banned:
              problems.append('밴률이 전부 0입니다. 빠른 대전 데이터를 받아온 것 같습니다')
          if problems:
              sys.exit('배포하지 않습니다 — ' + '; '.join(problems[:5]))
          PY

      # ---- 메타 분석 ----
      # 여기부터는 통계 배포의 곁가지다. 어느 단계가 실패해도 배포는 계속하고,
      # 분석 탭만 '분석 데이터 없음'으로 나온다.

      # 기록은 main 과 이력을 공유하지 않는 data 브랜치에 쌓는다. 같은 저장소 설정을 쓰는
      # worktree 라 checkout 이 넣어 둔 인증으로 그대로 푸시할 수 있다.
      - name: 기록 브랜치 받기
        id: history
        continue-on-error: true
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth 1 origin +refs/heads/data:refs/remotes/origin/data
            git worktree add -B data history origin/data
          else
            echo "data 브랜치가 없어 고아 브랜치로 새로 만듭니다."
            git worktree add --detach history
            git -C history checkout --orphan data
            git -C history rm -rf --quiet .
          fi

      # 등급 하나라도 기준선 칸이 비면 스크립트가 경고만 남기고 그날 스냅샷을 건너뛴다.
      - name: 스냅샷 기록
        if: steps.history.outcome == 'success'
        continue-on-error: true
        run: python scripts/history.py --history history

      - name: 패치노트 수집
        if: steps.history.outcome == 'success'
        continue-on-error: true
        run: python scripts/patch_notes.py --history history

      - name: 사실 표
        id: facts
        if: steps.history.outcome == 'success'
        continue-on-error: true
        run: python scripts/meta_facts.py facts --history history --facts "$RUNNER_TEMP/facts.json"

      # 영웅 순위나 구간 사이 패치 목록이 바뀐 날에만 부른다. 대개 패치당 한두 번이다.
      - name: 해설 생성 여부
        id: decide
        if: steps.facts.outcome == 'success'
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          python scripts/commentary_prompt.py --history history
          --facts "$RUNNER_TEMP/facts.json" --prompt "$RUNNER_TEMP/prompt.txt"

      # 도구를 모두 막고(--tools "") 출력은 스키마로 고정한다. 패치노트에 지시문 같은 문장이
      # 섞여 있어도 모델이 할 수 있는 일은 텍스트 출력뿐이다.
      - name: 해설 생성 (Claude Code)
        id: claude
        if: steps.decide.outputs.call == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          npm install --global --silent @anthropic-ai/claude-code
          if ! claude -p \
              --model "$CLAUDE_MODEL" \
              --tools "" \
              --output-format json \
              --json-schema "$(cat scripts/commentary.schema.json)" \
              --no-session-persistence \
              < "$RUNNER_TEMP/prompt.txt" > "$RUNNER_TEMP/claude.json"; then
            echo "::warning::해설 생성(claude -p)이 실패해 해설 없이 배포합니다. 토큰 만료나 사용 한도를 확인하세요."
            head -c 2000 "$RUNNER_TEMP/claude.json" || true
            rm -f "$RUNNER_TEMP/claude.json"
            exit 1
          fi

      # 새 해설이 있으면 문장마다 사실 표와 대조하고, 없으면 저장된 해설을 다시 쓰거나 비운다.
      - name: 해설 검증·분석 파일 쓰기
        id: publish
        if: steps.facts.outcome == 'success'
        continue-on-error: true
        run: >-
          python scripts/meta_facts.py publish --history history
          --facts "$RUNNER_TEMP/facts.json" --raw "$RUNNER_TEMP/claude.json"

      - name: 기록 커밋·푸시
        id: push
        if: steps.history.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd history
          git add -A
          if git diff --cached --quiet; then
            echo "기록에 바뀐 것이 없습니다."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --quiet -m "기록 $(TZ=Asia/Seoul date +%F)"
          if ! git push --quiet origin data; then
            echo "::warning::data 브랜치 푸시에 실패해 분석 탭 없이 배포합니다."
            exit 1
          fi

      - name: 분석이 실패하면 analysis.json 빼기
        if: steps.publish.outcome != 'success' || steps.push.outcome == 'failure'
        run: rm -f site/data/analysis.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
